<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Amit's To-Do List</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div>
        <h1>Amit's To-Do List</h1>
        <p id="today" class="today"></p>
      </div>
      <button class="icon-btn" id="theme-toggle" type="button" aria-label="Toggle light/dark theme" title="Toggle theme">&#9680;</button>
    </header>

    <div class="progress" aria-hidden="true"><div id="progress-bar"></div></div>
    <p id="progress-text" class="progress-text"></p>

    <form id="todo-form" autocomplete="off">
      <input type="text" id="todo-input" placeholder="Add a new task..." required>
      <div class="form-row">
        <select id="priority-input" aria-label="Priority">
          <option value="low">Low</option>
          <option value="medium" selected>Medium</option>
          <option value="high">High</option>
        </select>
        <input type="date" id="due-input" aria-label="Due date">
        <button type="submit">Add</button>
      </div>
    </form>

    <input type="search" id="search" placeholder="Search tasks..." aria-label="Search tasks">

    <div class="filters">
      <button class="filter active" data-filter="all">All</button>
      <button class="filter" data-filter="active">Active</button>
      <button class="filter" data-filter="completed">Completed</button>
    </div>

    <ul id="todo-list"></ul>

    <footer>
      <span id="count">0 tasks left</span>
      <span>
        <button id="toggle-all" type="button">Mark all done</button>
        <button id="clear-completed" type="button">Clear completed</button>
      </span>
    </footer>
    <p class="credit">Made by choudhary</p>
  </main>

  <script src="script.js"></script>
</body>
</html>
